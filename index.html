<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shonen Nexus</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --blue: #38bdf8;
    --blue2: #0ea5e9;
    --white: #f8fafc;
    --muted: #94a3b8;
    --dark: #02070c;
}

body {
    background: #020509;
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

/* =========================================================
   BANNER
========================================================= */

.banner {

    position: relative;

    width: min(100vw, 1280px);
    aspect-ratio: 16 / 9;

    overflow: hidden;

    background: #02070c;

    color: white;

    isolation: isolate;
}


/* =========================================================
   ANIME BACKGROUND

   IMPORTANT:
   Put the DIRECT image URL here.

   Example:
   https://example.com/image.jpg

   NOT a Google redirect URL.
========================================================= */

.background {

    position: absolute;
    inset: 0;

    z-index: -10;

    width: 100%;
    height: 100%;

    object-fit: cover;

    object-position: center;

    filter:
        brightness(.72)
        contrast(1.08)
        saturate(.95);

    transform: scale(1.03);

    transition:
        transform .4s ease;
}


/* =========================================================
   LEFT DARK GRADIENT

   Keeps the text readable while allowing the character
   to remain bright.
========================================================= */

.left-gradient {

    position: absolute;
    inset: 0;

    z-index: -5;

    background:

        linear-gradient(
            90deg,

            rgba(1,7,13,.98) 0%,
            rgba(1,7,13,.94) 22%,
            rgba(1,7,13,.72) 38%,
            rgba(1,7,13,.25) 58%,
            rgba(1,7,13,.02) 78%
        ),

        linear-gradient(
            0deg,
            rgba(0,0,0,.65),
            transparent 45%
        );
}


/* =========================================================
   BLUE LIGHT
========================================================= */

.blue-light {

    position: absolute;

    right: -10%;
    top: -20%;

    width: 70%;
    height: 130%;

    z-index: -4;

    background:

        radial-gradient(
            ellipse,
            rgba(14,165,233,.25),
            transparent 62%
        );

    filter: blur(35px);

    pointer-events: none;
}


/* =========================================================
   CINEMATIC VIGNETTE
========================================================= */

.vignette {

    position: absolute;
    inset: 0;

    z-index: 10;

    pointer-events: none;

    background:

        radial-gradient(
            ellipse at center,
            transparent 40%,
            rgba(0,0,0,.5) 100%
        );
}


/* =========================================================
   TOP LABEL
========================================================= */

.top-label {

    position: absolute;

    top: 5.5%;
    left: 5%;

    display: flex;
    align-items: center;

    gap: 12px;

    color: rgba(255,255,255,.65);

    font-size: clamp(8px, .9vw, 13px);

    font-weight: 800;

    letter-spacing: .28em;

    text-transform: uppercase;
}

.top-label::before {

    content: "";

    width: 32px;
    height: 2px;

    background: var(--blue);

    box-shadow:
        0 0 10px rgba(56,189,248,.7);
}


/* =========================================================
   MAIN TITLE
========================================================= */

.title {

    position: absolute;

    left: 5%;
    top: 17%;

    text-transform: uppercase;

    line-height: .82;

    z-index: 2;
}

.shonen {

    display: block;

    font-size: clamp(44px, 7vw, 100px);

    font-weight: 1000;

    letter-spacing: -.055em;

    color: #f8fafc;

    text-shadow:
        4px 5px 0 rgba(0,0,0,.45),
        0 0 30px rgba(0,0,0,.5);
}

.nexus {

    display: block;

    font-size: clamp(50px, 8vw, 115px);

    font-weight: 1000;

    letter-spacing: -.055em;

    color: transparent;

    background:
        linear-gradient(
            180deg,
            #ffffff 0%,
            #74d5ff 45%,
            #168bd0 100%
        );

    -webkit-background-clip: text;
    background-clip: text;

    -webkit-text-stroke:
        1px rgba(255,255,255,.7);

    filter:
        drop-shadow(0 5px 0 rgba(0,0,0,.4))
        drop-shadow(0 0 20px rgba(56,189,248,.2));
}


/* =========================================================
   JAPANESE DECORATION
========================================================= */

.jp {

    position: absolute;

    left: 4.4%;
    top: 43%;

    writing-mode: vertical-rl;

    color: rgba(255,255,255,.3);

    font-size: 15px;

    letter-spacing: .35em;

    border-right:
        1px solid rgba(255,255,255,.2);

    padding-right: 8px;
}


/* =========================================================
   TAGLINE
========================================================= */

.tagline {

    position: absolute;

    left: 5.3%;
    top: 55%;

    font-size: clamp(9px, 1.1vw, 15px);

    font-weight: 900;

    letter-spacing: .18em;

    text-transform: uppercase;

    color: #e2e8f0;
}

.tagline .blue {
    color: var(--blue);
}


/* =========================================================
   DESCRIPTION
========================================================= */

.description {

    position: absolute;

    left: 5.3%;
    top: 62%;

    width: 32%;

    color: rgba(226,232,240,.62);

    font-size: clamp(8px, .9vw, 12px);

    line-height: 1.65;
}


/* =========================================================
   CATEGORY BUTTONS
========================================================= */

.categories {

    position: absolute;

    left: 5.3%;
    bottom: 12%;

    display: flex;

    gap: 7px;

    flex-wrap: wrap;

    width: 40%;
}

.category {

    padding:
        6px 10px;

    border:
        1px solid rgba(148,163,184,.3);

    background:
        rgba(2,10,18,.55);

    backdrop-filter:
        blur(6px);

    color:
        rgba(255,255,255,.78);

    font-size:
        clamp(7px, .7vw, 10px);

    font-weight: 800;

    letter-spacing: .1em;

    text-transform: uppercase;
}

.category:first-child {

    color: var(--blue);

    border-color:
        rgba(56,189,248,.7);

    box-shadow:
        0 0 15px rgba(56,189,248,.1);
}


/* =========================================================
   JOIN
========================================================= */

.join {

    position: absolute;

    left: 5.3%;
    bottom: 5.5%;

    display: flex;

    align-items: center;

    gap: 10px;

    font-size: clamp(8px, .8vw, 11px);

    font-weight: 900;

    letter-spacing: .2em;

    text-transform: uppercase;
}

.arrow {

    width: 27px;
    height: 27px;

    display: flex;

    align-items: center;
    justify-content: center;

    border:
        1px solid var(--blue);

    color:
        var(--blue);

    box-shadow:
        0 0 12px rgba(56,189,248,.2);
}


/* =========================================================
   CLUB CARD
========================================================= */

.club {

    position: absolute;

    right: 4.5%;
    bottom: 5.5%;

    display: flex;

    align-items: center;

    gap: 10px;

    padding:
        7px 12px 7px 7px;

    background:
        rgba(2,8,14,.55);

    border:
        1px solid rgba(148,163,184,.22);

    backdrop-filter:
        blur(10px);
}

.club img {

    width: 42px;
    height: 42px;

    border-radius: 50%;

    border:
        2px solid rgba(56,189,248,.7);

    object-fit: cover;

    box-shadow:
        0 0 14px rgba(56,189,248,.2);
}

.club-name {

    font-size: 10px;

    font-weight: 900;

    letter-spacing: .12em;

    text-transform: uppercase;
}

.club-url {

    margin-top: 3px;

    font-size: 8px;

    color:
        rgba(255,255,255,.45);
}


/* =========================================================
   DIAGONAL ENERGY LINE
========================================================= */

.energy-line {

    position: absolute;

    top: -10%;
    bottom: -10%;

    left: 42%;

    width: 2px;

    background:
        linear-gradient(
            transparent,
            var(--blue),
            transparent
        );

    opacity: .55;

    transform:
        rotate(12deg);

    box-shadow:
        0 0 15px rgba(56,189,248,.6);
}


/* =========================================================
   SMALL GRAPHIC LINES
========================================================= */

.graphic-line {

    position: absolute;

    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(56,189,248,.6),
            transparent
        );

    opacity: .5;
}

.line-one {

    width: 180px;

    top: 9.5%;
    left: 28%;
}

.line-two {

    width: 100px;

    bottom: 20%;
    left: 35%;
}


/* =========================================================
   CHESS KNIGHT
========================================================= */

.knight {

    position: absolute;

    right: 5%;
    top: 5%;

    color:
        rgba(255,255,255,.16);

    font-size:
        clamp(24px, 3vw, 45px);

    transform:
        rotate(-8deg);
}


/* =========================================================
   PARTICLES
========================================================= */

.particles {

    position: absolute;

    inset: 0;

    z-index: 3;

    pointer-events: none;
}

.particle {

    position: absolute;

    width: 2px;
    height: 2px;

    border-radius: 50%;

    background: #8bdcff;

    box-shadow:
        0 0 7px #38bdf8;

    opacity: .4;

    animation:
        float 5s ease-in-out infinite;
}

@keyframes float {

    0%,100% {
        transform:
            translateY(0);

        opacity: .15;
    }

    50% {
        transform:
            translateY(-10px);

        opacity: .7;
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px) {

    .description {
        display: none;
    }

    .jp {
        display: none;
    }

    .categories {
        width: 45%;
    }

    .club-url {
        display: none;
    }
}

</style>
</head>


<body>

<div class="banner">

    <!-- =====================================================
         PUT YOUR DIRECT IMAGE URL HERE
    ====================================================== -->

    <img
        class="background"
        id="background"
        src="PASTE-DIRECT-IMAGE-URL-HERE"
        alt=""
    >


    <!-- LIGHTING -->

    <div class="left-gradient"></div>

    <div class="blue-light"></div>

    <div class="vignette"></div>


    <!-- GRAPHICS -->

    <div class="energy-line"></div>

    <div class="graphic-line line-one"></div>

    <div class="graphic-line line-two"></div>


    <!-- TOP -->

    <div class="top-label">
        ANIME • MANGA • COMMUNITY
    </div>


    <!-- TITLE -->

    <div class="title">

        <span class="shonen">
            SHONEN
        </span>

        <span class="nexus">
            NEXUS
        </span>

    </div>


    <!-- JAPANESE TEXT -->

    <div class="jp">
        少年 • ネクサス
    </div>


    <!-- TAGLINE -->

    <div class="tagline">

        <span class="blue">
            WHERE ANIME
        </span>

        MEETS THE BOARD

    </div>


    <!-- DESCRIPTION -->

    <div class="description">

        Anime, manga, games, events,
        and a community of fans.
        Step into the Nexus and find your place.

    </div>


    <!-- CATEGORY TAGS -->

    <div class="categories">

        <div class="category">
            Anime
        </div>

        <div class="category">
            Manga
        </div>

        <div class="category">
            Games
        </div>

        <div class="category">
            Events
        </div>

        <div class="category">
            Chess
        </div>

    </div>


    <!-- JOIN -->

    <div class="join">

        JOIN THE NEXUS

        <div class="arrow">
            →
        </div>

    </div>


    <!-- CLUB CARD -->

    <div class="club">

        <img
            src="https://images.chesscomfiles.com/uploads/v1/group/994818.bfac52ea.160x160o.db846a459c57@2x.jpg"
            alt="Shonen Nexus"
        >

        <div>

            <div class="club-name">
                SHONEN NEXUS
            </div>

            <div class="club-url">
                chess.com/club/shonen-nexus
            </div>

        </div>

    </div>


    <!-- CHESS -->

    <div class="knight">
        ♞
    </div>


    <!-- PARTICLES -->

    <div
        class="particles"
        id="particles">
    </div>

</div>


<script>

/* =========================================================
   PARTICLES
========================================================= */

const particleContainer =
    document.getElementById("particles");

for (
    let i = 0;
    i < 65;
    i++
) {

    const particle =
        document.createElement("div");

    particle.className =
        "particle";

    particle.style.left =
        Math.random() * 100 + "%";

    particle.style.top =
        Math.random() * 100 + "%";

    particle.style.animationDelay =
        Math.random() * 5 + "s";

    particle.style.animationDuration =
        3 + Math.random() * 5 + "s";

    particleContainer.appendChild(
        particle
    );
}


/* =========================================================
   PARALLAX
========================================================= */

const banner =
    document.querySelector(".banner");

const background =
    document.getElementById("background");

banner.addEventListener(
    "mousemove",
    (event) => {

        const rect =
            banner.getBoundingClientRect();

        const x =
            (event.clientX - rect.left)
            / rect.width - .5;

        const y =
            (event.clientY - rect.top)
            / rect.height - .5;

        background.style.transform =
            `
            scale(1.045)
            translate(
                ${x * -7}px,
                ${y * -4}px
            )
            `;
    }
);

banner.addEventListener(
    "mouseleave",
    () => {

        background.style.transform =
            "scale(1.03)";
    }
);

</script>

</body>
</html>
